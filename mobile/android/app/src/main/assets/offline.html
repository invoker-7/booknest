<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VECTOR</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F3EF; color: #17191C;
           font-family: sans-serif; }
    main { max-width: 420px; padding: 32px; }
    .mark { font-weight: 700; letter-spacing: .22em; font-size: 18px; padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid #17191C; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 0 10px; }
    p { color: #5C6066; line-height: 1.7; margin: 0 0 24px; }
    a { display: inline-block; background: #1F3A68; color: #fff; padding: 14px 26px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark">VECTOR</div>
    <h1>เชื่อมต่อร้านไม่ได้</h1>
    <p>ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วลองอีกครั้ง<br>Can't reach the store. Check your connection and try again.</p>
    <a id="retry" href="#">ลองอีกครั้ง / Retry</a>
  </main>
  <script>
    // แอปส่งที่อยู่หน้าที่เปิดไม่สำเร็จมาใน ?to=
    var to = new URLSearchParams(location.search).get("to");
    if (to) document.getElementById("retry").href = to;
  </script>
</body>
</html>
